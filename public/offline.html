<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#155dfc">
    <title>You are currently offline — ATS</title>
    <style>
        /* Mirrors the ATS design tokens in resources/css/app.css. This page
           must be fully self-contained: it is served from the service-worker
           cache when the network (and therefore the Vite CSS bundle) is
           unreachable. */
        :root {
            --pri: #155dfc;
            --pri600: #0f4fda;
            --pri50: #eef4ff;
            --title: #1e3a8a;
            --body: #374151;
            --label: #64748b;
            --page: #f7f6f2;
            --card: #fffefb;
            --border: #e8e4da;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--page);
            color: var(--body);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .offline-card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(30, 58, 138, 0.08);
        }
        .offline-card img {
            width: 84px;
            height: 84px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--title);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            line-height: 1.65;
            color: var(--label);
            margin-bottom: 8px;
        }
        .offline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 26px;
        }
        .btn {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 12px;
            border: 1px solid transparent;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:focus-visible {
            outline: 3px solid var(--pri);
            outline-offset: 2px;
        }
        .btn-primary {
            background: var(--pri);
            color: #ffffff;
        }
        .btn-primary:hover { background: var(--pri600); }
        .btn-secondary {
            background: var(--pri50);
            color: var(--pri600);
            border-color: var(--border);
        }
        .offline-hint {
            margin-top: 22px;
            font-size: 12px;
            color: var(--label);
        }
    </style>
</head>
<body>
    <main class="offline-card" role="main">
        <img src="/pwa/icons/icon-192x192.png" alt="Assignment Tracking System logo" width="84" height="84">
        <h1>You are currently offline</h1>
        <p>ATS could not connect to the server. Check your internet connection and try again.</p>
        <p>Previously loaded interface assets may remain available, but assignments, reports, updates and approvals require an active connection.</p>
        <div class="offline-actions">
            <button type="button" class="btn btn-primary" id="retry">Try Again</button>
            <a class="btn btn-secondary" href="/home">Return to Dashboard</a>
        </div>
        <p class="offline-hint" role="status" aria-live="polite" id="status"></p>
    </main>
    <script src="/pwa/offline.js"></script>
</body>
</html>
